
name: ape04

services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ape04-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped

    ports:
      - "127.0.0.1:5679:5672"
      - "127.0.0.1:15680:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Configurar usuario}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configurar contraseña}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:stable-alpine
    container_name: ape04-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8090:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rabbitmq_data:
