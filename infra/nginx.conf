
events {
    worker_connections 1024;
}

http {

    # ==================================================
    # REGISTRO DE SOLICITUDES
    # ==================================================

    log_format ape04
        '$remote_addr [$time_local] '
        '"$request" status=$status '
        'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log ape04;

    # ==================================================
    # DNS DE DOCKER - SOLO IPV4
    # ==================================================

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ==================================================
    # JAVA SPRING BOOT - BALANCEO 3:1
    # ==================================================

    upstream vehiculos_backend {

        zone vehiculos_backend 64k;

        server host.docker.internal:8083
            resolve
            weight=3
            max_fails=1
            fail_timeout=5s;

        server host.docker.internal:8082
            resolve
            weight=1
            max_fails=1
            fail_timeout=5s;
    }

    # ==================================================
    # PYTHON FASTAPI
    # ==================================================

    upstream ventas_backend {

        zone ventas_backend 64k;

        server host.docker.internal:8002
            resolve
            max_fails=1
            fail_timeout=5s;
    }

    # ==================================================
    # JAVA NOTIFICACIONES
    # ==================================================

    upstream notificaciones_backend {

        zone notificaciones_backend 64k;

        server host.docker.internal:8081
            resolve
            max_fails=1
            fail_timeout=5s;
    }

    # ==================================================
    # SERVIDOR PRINCIPAL
    # ==================================================

    server {

        listen 80;
        server_name localhost;

        # Encabezados hacia los servicios.
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Recuperacion de errores de upstream.
        proxy_next_upstream
            error
            timeout
            http_502
            http_503
            http_504;

        # ==================================================
        # COMPROBACION DE NGINX
        # ==================================================

        location = /nginx-ping {
            default_type text/plain;
            return 200 "NGINX funcionando\n";
        }

        # ==================================================
        # AUTENTICACION JAVA
        # ==================================================

        location /oauth/ {
            proxy_pass http://vehiculos_backend;
        }

        # ==================================================
        # VEHICULOS JAVA
        # ==================================================

        location /api/vehiculos {
            proxy_pass http://vehiculos_backend;
        }

        # ==================================================
        # IDENTIDAD JAVA
        # ==================================================

        location /api/identidad {
            proxy_pass http://vehiculos_backend;
        }

        # ==================================================
        # SALUD JAVA
        # ==================================================

        location /actuator/health {
            proxy_pass http://vehiculos_backend;
        }

        # ==================================================
        # COMPRADORES FASTAPI
        # ==================================================

        location /api/compradores {
            proxy_pass http://ventas_backend;
        }

        # ==================================================
        # VENTAS FASTAPI
        # ==================================================

        location /api/ventas {
            proxy_pass http://ventas_backend;
        }

        # ==================================================
        # NOTIFICACIONES JAVA
        # ==================================================

        location /api/notificaciones {
            proxy_pass http://notificaciones_backend;
        }

        # ==================================================
        # RUTAS DESCONOCIDAS
        # ==================================================

        location / {
            return 404;
        }
    }
}
